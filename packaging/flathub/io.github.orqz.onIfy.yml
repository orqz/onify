# The manifest for Flathub: the same build as packaging/flatpak, but from a
# tagged release on GitHub instead of this folder. See README.md here.
id: io.github.orqz.onIfy
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
    - org.freedesktop.Sdk.Extension.rust-stable
command: onify
finish-args:
    - --share=network
    - --share=ipc
    - --socket=wayland
    - --socket=fallback-x11
    - --device=dri
    - --socket=pulseaudio
    # Local Files reads your music folder
    - --filesystem=xdg-music:ro
    # Media keys and now playing controls
    - --own-name=org.mpris.MediaPlayer2.onify
build-options:
    append-path: /usr/lib/sdk/rust-stable/bin
    env:
        CARGO_HOME: /run/build/onify/cargo
modules:
    - name: onify
      buildsystem: simple
      build-commands:
          - cargo --offline build --release --locked
          - install -Dm755 target/release/onify -t /app/bin/
          - install -Dm644 data/io.github.orqz.onIfy.desktop -t /app/share/applications/
          - install -Dm644 data/icons/io.github.orqz.onIfy.svg -t /app/share/icons/hicolor/scalable/apps/
          - install -Dm644 data/io.github.orqz.onIfy.metainfo.xml -t /app/share/metainfo/
      sources:
          - type: git
            url: https://github.com/orqz/onify.git
            tag: v0.1.4.1
            commit: 4bd490658801b50758e09b3a90ede35c2866bf4b
          - cargo-sources.json
