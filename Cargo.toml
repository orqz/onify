[package]
name = "onify"
version = "0.1.4+1"
edition = "2024"
description = "A smooth, lightweight native Spotify client"
license = "MIT"
repository = "https://github.com/orqz/onify"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
librespot-core = "0.8"
librespot-connect = "0.8"
librespot-oauth = "0.8"
librespot-metadata = "0.8"
# Playlist changes are sent as the playlist service's own protobuf messages.
librespot-protocol = "0.8"
protobuf = "3"
librespot-playback = { version = "0.8", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
http = "1"
bytes = "1"
http-body-util = "0.1"
url = "2"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# Local files: same decoder librespot uses, plus MP4/AAC so .mp4 files play too.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "isomp4", "aac"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
libpulse-binding = "2"
libpulse-simple-binding = "2"
mpris-server = "0.10"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.16"
souvlaki = "0.8"

[target.'cfg(windows)'.dependencies]
gdk4-win32 = "0.11"
tray-icon = "0.26.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Com", "Win32_Security", "Win32_Media", "Win32_System_DataExchange", "Win32_System_Memory"] }

# librespot's decoder only plays 44.1 kHz local files; this copy resamples
# the rest (see vendor/librespot-playback/src/decoder/resampler.rs).
[patch.crates-io]
librespot-playback = { path = "vendor/librespot-playback" }
# Free accounts made this exit the whole app (see vendor/librespot-core/ONIFY.md).
librespot-core = { path = "vendor/librespot-core" }
# Previous stopped playback on the first song played (see its ONIFY.md).
librespot-connect = { path = "vendor/librespot-connect" }

[build-dependencies]
glib-build-tools = "0.22"

# Keep debug builds fast enough to play audio without stutter.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 8
strip = true
panic = "abort"
